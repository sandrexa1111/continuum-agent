[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "continuum-agent"
version = "0.1.0"
description = "Portable checkpointing and state migration for long-lived agent runtimes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alexandre Mosiashvili" }]
keywords = ["agents", "checkpoint", "state", "serialization", "content-addressed", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

# Deliberately zero runtime dependencies. See docs/adr/002-zero-dependencies.md
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
continuum = "continuum.cli:main"

[project.urls]
Homepage = "https://github.com/sandrexa1111/continuum-agent"
Specification = "https://github.com/sandrexa1111/continuum-agent/tree/main/spec"
Issues = "https://github.com/sandrexa1111/continuum-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["continuum"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
